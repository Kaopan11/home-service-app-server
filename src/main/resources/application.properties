spring.application.name=home-service-app-server

server.port=${PORT:8080}

# prepareThreshold=0 disables server-side prepared statements: required for Supabase's
# PgBouncer transaction-mode pooler (port 6543), which otherwise throws
# "prepared statement already exists" when queries land on a different backend connection.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/home_service_app}&prepareThreshold=0
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
